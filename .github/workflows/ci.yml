name: User Center CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: user_center_service_test
          MYSQL_USER: user_center_test_app
          MYSQL_PASSWORD: ci_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      FLASK_ENV: testing

      DATABASE_URL: >-
        mysql+pymysql://user_center_test_app:ci_test_password@127.0.0.1:3306/user_center_service_test?charset=utf8mb4

      TEST_DATABASE_URL: >-
        mysql+pymysql://user_center_test_app:ci_test_password@127.0.0.1:3306/user_center_service_test?charset=utf8mb4

      JWT_SECRET_KEY: ci-only-jwt-secret

      JWT_ACCESS_TOKEN_MINUTES: 30

      BASE_URL: http://127.0.0.1:5001


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Flask test-client tests
        run: |
          pytest tests -v \
            --alluredir=allure-results \
            --clean-alluredir


      - name: Start Flask test server
        run: |
          nohup python run_test_server.py \
            > test-server.log 2>&1 &

          echo $! > test-server.pid

          echo "Waiting for test server..."

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              "${BASE_URL}/api/health" \
              > /dev/null; then

              echo "Test server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "Test server failed to start."
          cat test-server.log
          exit 1


      - name: Run HTTP integration tests
        run: |
          pytest integration_tests -v \
            --alluredir=allure-results


      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: user-center-test-artifacts
          path: |
            allure-results
            test-server.log
          if-no-files-found: warn
          retention-days: 7